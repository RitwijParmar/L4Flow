[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "l4flow"
version = "0.1.0"
description = "Engine-agnostic inference SLO and cost regression gates for GCP and OpenAI-compatible endpoints"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "uvicorn[standard]>=0.30,<1",
  "google-auth>=2.30,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
]
local-benchmark = [
  "torch>=2.3",
  "transformers>=4.57",
]

[project.scripts]
l4flow-benchmark = "l4flow.benchmark:main"
l4flow-gate = "l4flow.gate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
